name: Deploy do App Vite para o GitHub Pages

on:
  push:
    branches: ['main'] # Executa sempre que der push na branch main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        uses-with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Fazer o Build da aplicação
        run: npm run build

      - name: Configurar Páginas
        uses: actions/configure-pages@v5

      - name: Upload do Build
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Pasta onde o Vite gera os arquivos compilados

      - name: Deploy para o GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4